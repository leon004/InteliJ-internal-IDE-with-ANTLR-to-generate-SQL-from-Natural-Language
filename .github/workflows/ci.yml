name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, unit tests and MySQL integration tests
        env:
          NL2SQL_DB_URL: jdbc:mysql://127.0.0.1:3306/?allowPublicKeyRetrieval=true&useSSL=false
          NL2SQL_DB_USER: root
          NL2SQL_DB_PASSWORD: root
        run: mvn -B verify

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: nl2sql-ide
          path: target/nl2sql-ide-*-all.jar
